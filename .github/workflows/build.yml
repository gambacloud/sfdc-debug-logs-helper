name: Build Multi-OS Executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            suffix: .exe
            sep: ";"
          - os: ubuntu-latest
            suffix: ""
            sep: ":"
          - os: macos-latest
            suffix: ""
            sep: ":"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable using PyInstaller
      shell: pwsh
      run: |
        pyinstaller --onefile `
        --add-data "static${{ matrix.sep }}static" `
        --add-data "templates${{ matrix.sep }}templates" `
        --hidden-import="uvicorn.logging" `
        --hidden-import="uvicorn.protocols.http.h11_impl" `
        --hidden-import="uvicorn.protocols.websockets.websockets_impl" `
        --hidden-import="uvicorn.lifespan.on" `
        main.py -n SFDC_Debug_Logs_Helper_${{ matrix.os }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SFDC_Debug_Logs_Helper_${{ matrix.os }}
        path: dist/SFDC_Debug_Logs_Helper_${{ matrix.os }}${{ matrix.suffix }}
